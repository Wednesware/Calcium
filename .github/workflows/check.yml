name: Compiler checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  differential:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install native library development files
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libsqlite3-dev libpcre2-dev libarchive-dev libcurl4-openssl-dev openssl
      - name: Install development tools
        run: python -m pip install -e '.[test]' ruff build
      - name: Check formatting and imports
        run: |
          ruff check calcium tests tools
          ruff format --check calcium tests examples tools
      - name: Compile and compare against CPython with GCC and Clang
        run: python -m pytest -q
      - name: Run UBSan arithmetic and cleanup checks
        env:
          CALCIUM_SANITIZERS: '1'
        run: python -m pytest -q tests/test_sanitizers.py
      - name: Build distributable and verify bundled runtime
        run: |
          python -m build
          python -c "import zipfile, glob; z=zipfile.ZipFile(glob.glob('dist/*.whl')[0]); assert 'calcium/runtime/calcium_runtime.c' in z.namelist(); assert 'calcium/runtime/calcium_runtime.h' in z.namelist(); assert 'calcium/runtime/calcium_modules.c' in z.namelist(); assert 'calcium/runtime/native/include/cart.h' in z.namelist(); assert 'calcium/runtime/native/src/integers.c' in z.namelist(); import json, calcium; assert json.loads(z.read('calcium/.nitropkg'))['version'] == calcium.__version__"
      - name: Verify installed wheel outside checkout
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python tests/wheel_smoke.py
      - name: Build and verify standalone native examples
        if: matrix.python == '3.14'
        run: python examples/native/build_release.py --output native-release
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.14'
        with:
          name: standalone-native-examples
          path: native-release/*.tar.gz
          if-no-files-found: error
